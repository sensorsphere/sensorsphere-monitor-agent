services:
  monitor-agent:
    image: ${MONITOR_AGENT_IMAGE:-ghcr.io/sensorsphere/sensorsphere-monitor-agent:latest}
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    cap_add:
      - NET_RAW
    environment:
      SENSORSPHERE_URL: ${SENSORSPHERE_URL}
      SENSORSPHERE_AGENT_TOKEN: ${SENSORSPHERE_AGENT_TOKEN}
      SENSORSPHERE_HEARTBEAT_INTERVAL_SECONDS: ${SENSORSPHERE_HEARTBEAT_INTERVAL_SECONDS:-30}
      SENSORSPHERE_CONFIG_POLL_INTERVAL_SECONDS: ${SENSORSPHERE_CONFIG_POLL_INTERVAL_SECONDS:-15}
      SENSORSPHERE_REQUEST_TIMEOUT_MS: ${SENSORSPHERE_REQUEST_TIMEOUT_MS:-10000}
      SENSORSPHERE_STATE_FILE: ${SENSORSPHERE_STATE_FILE:-/app/data/monitor-agent-state.json}
      SENSORSPHERE_QUEUE_MAX_RESULTS: ${SENSORSPHERE_QUEUE_MAX_RESULTS:-10000}
      SENSORSPHERE_QUEUE_RETENTION_HOURS: ${SENSORSPHERE_QUEUE_RETENTION_HOURS:-72}
      SENSORSPHERE_LOG_LEVEL: ${SENSORSPHERE_LOG_LEVEL:-info}
      AGENT_LABELS: ${AGENT_LABELS:-}
      AGENT_NAME: ${AGENT_NAME:-}
    volumes:
      - ${DATA_DIR:-./data}:/app/data
