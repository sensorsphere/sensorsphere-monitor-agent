services:
  monitor-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENT_VERSION: ${MONITOR_AGENT_VERSION:-1.0.3}
        OCI_SOURCE: ${OCI_SOURCE:-local}
        OCI_REVISION: ${OCI_REVISION:-local}
    image: ${MONITOR_AGENT_IMAGE:-sensorsphere-monitor-agent:local}
